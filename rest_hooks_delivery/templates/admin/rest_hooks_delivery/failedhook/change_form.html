{% extends "admin/change_form.html" %}

{% block title %}{{ opts.verbose_name|capfirst }}: {{ original|truncatechars:40 }} | {{ site_title|default:_('Django site admin') }}{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
#failedhook_form {
    .field-payload, 
    .field-response_headers, 
    .field-response_body {
        .readonly {
            font-family: monospace;
            white-space: pre;
            overflow-x: auto;
        }
    }
}
</style>
{% endblock %}

{% block extrabody %}
{{ block.super }}
<script>
(function() {
    "use strict";

    const els = document.querySelectorAll(".field-payload, .field-response_headers, .field-response_body");
    els.forEach(el => {
        const readonly = el.querySelector(".readonly");
        if (!readonly) return;
        
        try {
            const parsed = JSON.parse(readonly.textContent);
            readonly.textContent = JSON.stringify(parsed, null, 2);
        } catch (e) {
            // Not valid JSON, leave it alone
            console.warn("Could not parse JSON in", el, e);
        }
    });
})();
</script>
{% endblock %}
